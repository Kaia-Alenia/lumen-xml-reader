[package]
name = "lumen_windows"
version = "1.2.1"
description = "LUMEN - Clean XML and CFDI reader for Windows by Alenia Studios"
authors = ["Alenia Studios"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "lumen_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
