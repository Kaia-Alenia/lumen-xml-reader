name: CI Build and Release (Android + Windows)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/**/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk LUMEN-app-debug.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-android
          path: LUMEN-app-debug.apk

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/windows/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm install

      - name: Run unit tests
        working-directory: apps/windows
        run: npm test

      - name: Run Rust unit tests
        working-directory: apps/windows/src-tauri
        run: cargo test

      - name: Build Tauri Windows bundle
        working-directory: apps/windows
        run: npm run tauri build

      - name: Collect Windows installers
        shell: bash
        run: |
          mkdir -p release-windows
          EXE_FILE=$(ls apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -n 1)
          if [ -z "$EXE_FILE" ]; then
            echo "ERROR: NSIS .exe installer was not generated"
            exit 1
          fi
          cp "$EXE_FILE" release-windows/LUMEN-windows-setup.exe
          MSI_FILE=$(ls apps/windows/src-tauri/target/release/bundle/msi/*.msi 2>/dev/null | head -n 1)
          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" release-windows/LUMEN-windows.msi
          fi
          ls -lh release-windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: release-windows/*

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: lumen-android
          path: artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: lumen-windows
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'LUMEN Latest Build' }}
          body: |
            Compilación automática del monorepo LUMEN - Lector XML y CFDI.
            - **Android**: `LUMEN-app-debug.apk`
            - **Windows**: `LUMEN-windows-setup.exe` / `LUMEN-windows.msi`
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
